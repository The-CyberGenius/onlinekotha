name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ubuntu
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ubuntu_HOST }}
          username: ${{ secrets.ubuntu_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory (Change this path if needed)
            cd /home/${{ secrets.EC2_USERNAME }}/OnlineKotha || cd /var/www/OnlineKotha || cd ~/onlinekotha || cd ~/kotha
            
            # Pull latest code
            git pull origin main
            
            # Install any new dependencies
            npm install
            
            # Restart the app using PM2 (adjust process name if needed)
            pm2 restart all
