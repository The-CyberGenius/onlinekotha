server {
    listen 80;
    server_name your_domain_or_ip; # REPLACE WITH YOUR DOMAIN OR IP

    # Redirect non-HTTPS traffic to HTTPS if you configure SSL later
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/your_domain/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your_domain/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # Real IP headers for analytics and rate limiting
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running AI requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Optional: Serve public static files directly through Nginx for better performance
    location /static/ {
        alias /home/ubuntu/onlinekotha/public/; # Make sure this matches your deployed path
        expires 30d;
        access_log off;
    }
}
